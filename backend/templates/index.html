<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>EchoPilot</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
<h1>🚀 EchoPilot</h1>
<div class="grid">
<div class="card"><h3>CPU</h3><p id="cpu">0%</p></div>
<div class="card"><h3>RAM</h3><p id="ram">0%</p></div>
<div class="card"><h3>Disk</h3><p id="disk">0%</p></div>
<div class="card"><h3>Battery</h3><p id="battery">N/A</p></div>
<div class="card wide"><h3>Time</h3><p id="time"></p></div>
</div>
<button onclick="openChrome()">🌐 Open Chrome</button>
</div>
<script src="/static/script.js"></script>
</body></html>
